# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: CowboyChurch/cowboychurch
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0ed0bae7-5143-4980-816f-b40488b7ca68/pkce
  auth_token_endpoint: /sites/0ed0bae7-5143-4980-816f-b40488b7ca68/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://cowboychurch.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

# Uploaded CMS images will be stored in assets/uploads and referenced publicly as /assets/uploads/filename.

collections:
  - name: "calendar"
    label: "📅 Manage Church Calendar"
    description: "Add, edit, feature, and remove church events. Changes publish to the public Calendar and Events pages after Netlify redeploys."
    files:
      - name: "events"
        label: "🗓️ Edit Church Events"
        file: "content/events.json"
        fields:
          - label: "Event"
            name: "events"
            widget: "list"
            summary: "{{fields.date}} • {{fields.title}}"
            minimize_collapsed: true
            add_to_top: true
            hint: "Click Add Event to add a new calendar item. Turn on Featured Event for events that should be highlighted on the Events page."
            fields:
              - label: "Event Title"
                name: "title"
                widget: "string"
                hint: "Example: Vacation Bible School, Wednesday Bible Study, Men's Breakfast. This title appears on the website."
              - label: "Event Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                hint: "Pick the main date for this event. For repeating events, pick the next upcoming date."
              - label: "Event Time"
                name: "time"
                widget: "string"
                required: false
                hint: "Example: 10:00 AM, 6:30 PM, After Sunday Service. Leave blank if there is no set time."
              - label: "Event Location"
                name: "location"
                widget: "string"
                required: false
                hint: "Example: Sanctuary, Lobby, Fellowship Hall, The Cowboy Church, or an off-site location."
              - label: "Repeating Schedule"
                name: "recurring"
                widget: "select"
                required: false
                hint: "Choose how often this event repeats. Choose One-time Event if it does not repeat."
                options:
                  - "One-time Event"
                  - "Weekly"
                  - "Monthly"
                  - "Yearly"
                  - "Seasonal / Special Schedule"
              - label: "Repeating Schedule Details"
                name: "recurring_details"
                widget: "string"
                required: false
                hint: "Optional details. Example: Every Wednesday, Third Sunday of each month, or June-August only."
              - label: "Featured Event?"
                name: "featured"
                widget: "boolean"
                default: false
                required: false
                hint: "Turn this on if this event should be highlighted on the Events page."
              - label: "Event Description"
                name: "description"
                widget: "text"
                required: false
                hint: "Add the details visitors need to know: who it is for, what to expect, and any registration information."

  - name: "stories"
    label: "📖 Manage Stories & Photos"
    description: "Add testimonies, ministry highlights, church photos, and stories from the life of The Cowboy Church."
    files:
      - name: "stories"
        label: "📷 Edit Stories & Testimonies"
        file: "content/stories.json"
        fields:
          - label: "Story or Photo Highlight"
            name: "stories"
            widget: "list"
            summary: "{{fields.date}} • {{fields.title}}"
            minimize_collapsed: true
            add_to_top: true
            hint: "Click Add Story or Photo Highlight to add a testimony, church photo, ministry highlight, or update."
            fields:
              - label: "Story Title"
                name: "title"
                widget: "string"
                hint: "This title appears on the Stories & Photos page."
              - label: "Story Type"
                name: "category"
                widget: "select"
                required: false
                hint: "Choose the kind of story or highlight this is."
                options:
                  - "Testimony"
                  - "Ministry Highlight"
                  - "Church Family"
                  - "Children's Ministry"
                  - "Youth Ministry"
                  - "Men's Ministry"
                  - "Women's Ministry"
                  - "Community Outreach"
                  - "Photos"
              - label: "Story Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                hint: "Choose the date connected with this story or photo highlight."
              - label: "Story Photo"
                name: "image"
                widget: "image"
                required: false
                hint: "Upload or choose a photo. Landscape photos work best. Recommended width: 1600 pixels or larger."
              - label: "Short Website Summary"
                name: "summary"
                widget: "text"
                required: false
                hint: "A short preview shown before the full story. Keep this to one or two sentences."
              - label: "Full Story / Testimony"
                name: "body"
                widget: "markdown"
                required: false
                hint: "Write the full story, testimony, ministry highlight, or photo description here."
              - label: "Featured Story?"
                name: "featured"
                widget: "boolean"
                default: false
                required: false
                hint: "Turn this on if this story should be highlighted more prominently."
