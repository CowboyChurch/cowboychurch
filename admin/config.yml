# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: CowboyChurch/cowboychurch
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/0ed0bae7-5143-4980-816f-b40488b7ca68/pkce
  auth_token_endpoint: /sites/0ed0bae7-5143-4980-816f-b40488b7ca68/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://cowboychurch.netlify.app

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "calendar"
    label: "Church Calendar"
    files:
      - name: "events"
        label: "Events"
        file: "content/events.json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - {label: "Event Name", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "Time", name: "time", widget: "string", required: false}
              - {label: "Location", name: "location", widget: "string", required: false}
              - {label: "Repeating Schedule", name: "recurring", widget: "string", required: false, hint: "Example: Weekly on Sundays, Third Sunday of each month"}
              - {label: "Featured on Events Page", name: "featured", widget: "boolean", default: false, required: false}
              - {label: "Description", name: "description", widget: "text", required: false}
  - name: "stories"
    label: "Stories & Photos"
    files:
      - name: "stories"
        label: "Stories"
        file: "content/stories.json"
        fields:
          - label: "Stories"
            name: "stories"
            widget: "list"
            summary: "{{fields.title}} - {{fields.date}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false}
              - {label: "Image", name: "image", widget: "image", required: false}
              - {label: "Summary", name: "summary", widget: "text", required: false}
              - {label: "Story", name: "body", widget: "markdown", required: false}
              - {label: "Featured", name: "featured", widget: "boolean", default: false, required: false}
